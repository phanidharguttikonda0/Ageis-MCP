[package]
name = "aegis-mcp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Aegis-MCP: Semantic caching server and governance layer for LLM requests"

[[bin]]
name = "aegis-mcp"
path = "src/main.rs"

[dependencies]
aegis-core = { path = "../aegis-core" }

# Workspace dependencies
axum = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
config = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
aegis-core = { path = "../aegis-core", features = ["testing"] }

[features]
default = ["production"]
development = [
    "aegis-core/development",
    "tracing-subscriber/env-filter",
]
testing = [
    "aegis-core/testing",
]
production = [
    "aegis-core/production",
]
