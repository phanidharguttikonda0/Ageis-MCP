# Aegis-MCP Production Configuration

[server]
host = "0.0.0.0"
port = 8080
max_connections = 10000

[redis]
url = "${REDIS_URL}"  # Set environment variable
pool_size = 50
connection_timeout = 5000
max_lifetime = 3600

[cache]
similarity_threshold = 0.95
max_cache_size = 100000
ttl_seconds = 604800  # 7 days

[llm]
upstream_url = "https://api.openai.com/v1"
api_key = "${OPENAI_API_KEY}"  # Set environment variable
model = "gpt-4"
timeout = 30000
max_retries = 3

[observability]
log_level = "info"
jaeger_endpoint = "http://jaeger:4318"
