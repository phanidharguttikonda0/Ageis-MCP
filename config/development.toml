# Aegis-MCP Development Configuration

[server]
host = "127.0.0.1"
port = 8080
max_connections = 100

[redis]
url = "redis://localhost:6379"
pool_size = 5
connection_timeout = 5000
max_lifetime = 3600

[cache]
similarity_threshold = 0.95
max_cache_size = 10000
ttl_seconds = 86400

[llm]
upstream_url = "https://api.openai.com/v1"
api_key = "${OPENAI_API_KEY}"  # Set environment variable
model = "gpt-4"
timeout = 30000
max_retries = 3

[observability]
log_level = "debug"
jaeger_endpoint = "http://localhost:4318"
