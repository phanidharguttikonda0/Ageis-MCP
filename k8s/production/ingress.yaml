apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aegis-mcp-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
spec:
  tls:
  - hosts:
    - aegis-mcp.yourdomain.com
    secretName: aegis-mcp-tls
  rules:
  - host: aegis-mcp.yourdomain.com
    http:
      paths:
      - path: /api(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: aegis-mcp-service
            port:
              number: 8080

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: redis-pv
  namespace: default
spec:
  capacity:
    storage: 10Gi
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: standard
  hostPath:
    path: /mnt/data/redis

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: aegis-mcp-pdb
  namespace: default
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: aegis-mcp

---
apiVersion: v1
kind: ServiceMonitor
metadata:
  name: aegis-mcp
  namespace: default
  labels:
    app: aegis-mcp
spec:
  selector:
    matchLabels:
      app: aegis-mcp
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s