apiVersion: v1
kind: Secret
metadata:
  name: aegis-secrets
  namespace: default
type: Opaque
stringData:
  # LLM Provider Configuration
  # IMPORTANT: Replace these values with your actual API keys
  openai-api-key: "your-openai-api-key-here"
  llm-upstream-url: "https://api.openai.com/v1"
  llm-model: "gpt-4"

  # Jaeger Tracing (optional)
  jaeger-endpoint: ""  # e.g., "http://jaeger:4318"

---
# Example: Create secret using kubectl
# kubectl create secret generic aegis-secrets \
#   --from-literal=openai-api-key='sk-...' \
#   --from-literal=llm-upstream-url='https://api.openai.com/v1' \
#   --from-literal=llm-model='gpt-4' \
#   --namespace=default