apiVersion: v1
kind: ConfigMap
metadata:
  name: aegis-mcp-config
  namespace: default
data:
  # Server Configuration
  AEGIS_SERVER_HOST: "0.0.0.0"
  AEGIS_SERVER_PORT: "8080"
  AEGIS_SERVER_MAX_CONNECTIONS: "100"

  # Redis Configuration
  AEGIS_REDIS_URL: "redis://redis-service:6379"
  AEGIS_REDIS_POOL_SIZE: "10"
  AEGIS_REDIS_CONNECTION_TIMEOUT: "5000"
  AEGIS_REDIS_MAX_LIFETIME: "3600"

  # Cache Configuration
  AEGIS_CACHE_SIMILARITY_THRESHOLD: "0.95"
  AEGIS_CACHE_MAX_SIZE: "10000"
  AEGIS_CACHE_TTL_SECONDS: "3600"

  # Observability Configuration
  AEGIS_LOG_LEVEL: "info"
  RUST_LOG: "info"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-mcp
  namespace: default
  labels:
    app: aegis-mcp
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aegis-mcp
  template:
    metadata:
      labels:
        app: aegis-mcp
        version: v1
    spec:
      containers:
      - name: aegis-mcp
        image: aegis-mcp:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: AEGIS_SERVER_HOST
          valueFrom:
            configMapKeyRef:
              name: aegis-mcp-config
              key: AEGIS_SERVER_HOST
        - name: AEGIS_SERVER_PORT
          valueFrom:
            configMapKeyRef:
              name: aegis-mcp-config
              key: AEGIS_SERVER_PORT
        - name: AEGIS_REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: aegis-mcp-config
              key: AEGIS_REDIS_URL
        - name: AEGIS_CACHE_SIMILARITY_THRESHOLD
          valueFrom:
            configMapKeyRef:
              name: aegis-mcp-config
              key: AEGIS_CACHE_SIMILARITY_THRESHOLD
        - name: RUST_LOG
          valueFrom:
            configMapKeyRef:
              name: aegis-mcp-config
              key: RUST_LOG
        - name: AEGIS_LLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: aegis-secrets
              key: openai-api-key
        - name: AEGIS_LLM_UPSTREAM_URL
          valueFrom:
            secretKeyRef:
              name: aegis-secrets
              key: llm-upstream-url
        - name: AEGIS_LLM_MODEL
          valueFrom:
            secretKeyRef:
              name: aegis-secrets
              key: llm-model
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        volumeMounts:
        - name: cache
          mountPath: /tmp/cache
      volumes:
      - name: cache
        emptyDir:
          sizeLimit: 100Mi
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - aegis-mcp
              topologyKey: kubernetes.io/hostname

---
apiVersion: v1
kind: Service
metadata:
  name: aegis-mcp-service
  namespace: default
  labels:
    app: aegis-mcp
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: aegis-mcp

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aegis-mcp-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aegis-mcp
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60