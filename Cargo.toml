[workspace]
members = [
    "crates/aegis-mcp",
    "crates/aegis-core",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Aegis-MCP Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/phanidharguttikonda0/Ageis-MCP"

[workspace.dependencies]
# Web framework
axum = { version = "0.7", default-features = false, features = ["tokio", "http1", "http2", "json"] }
tower = { version = "0.4", default-features = false }
tower-http = { version = "0.5", default-features = false, features = ["cors", "trace", "compression-gzip"] }

# Async runtime
tokio = { version = "1.35", default-features = false, features = ["full"] }
tokio-util = { version = "0.7", default-features = false }

# Redis client
redis = { version = "0.24", default-features = false, features = ["tokio-comp", "connection-manager", "aio"] }
deadpool-redis = { version = "0.14", default-features = false }

# Serialization
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["raw_value"] }

# Observability
tracing = { version = "0.1", default-features = false, features = ["attributes", "log-always"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "env-filter"] }
tracing-opentelemetry = { version = "0.22", default-features = false }

# Configuration
config = { version = "0.14", default-features = false, features = ["toml", "json"] }

# Error handling
anyhow = { version = "1.0", default-features = false }
thiserror = { version = "1.0" }

# UUIDs
uuid = { version = "1.6", default-features = false, features = ["v4", "serde"] }

# HTTP client
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }

# Async utilities
async-trait = { version = "0.1", default-features = false }
futures = { version = "0.3", default-features = false }

# OpenTelemetry
opentelemetry = { version = "0.21", default-features = false }
opentelemetry-jaeger = { version = "0.20", default-features = false, features = ["rt-tokio"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 0
